services:
  postgres:
    image: postgres:17
    container_name: ticketz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketz
      POSTGRES_PASSWORD: ticketz
      POSTGRES_DB: ticketz
    ports:
      - '5432:5432'
    volumes:
      - ticketz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketz -d ticketz']
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO — object storage for event/community image uploads. Activated in E10-T2.
